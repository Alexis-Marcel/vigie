name: Vérifications

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Types (interface)
        run: pnpm check
      - name: Types (ligne de commande)
        run: pnpm exec tsc -p tsconfig.cli.json
      - name: Build
        run: pnpm build
